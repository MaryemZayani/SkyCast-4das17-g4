spring.application.name=alerte-service
server.port=8086

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/alerte_db

# Eureka : demarrage sans serveur Eureka (a mettre a true quand Eureka tourne)
eureka.client.enabled=false

# Config Server : connexion facultative au demarrage
spring.config.import=optional:configserver:

# OpenFeign
spring.cloud.openfeign.client.config.default.connectTimeout=5000
spring.cloud.openfeign.client.config.default.readTimeout=5000